<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pill Reminder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>💊</text></svg>">
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #22d3ee;
    --accent-dim: #0e7490;
    --green: #34d399;
    --red: #f87171;
    --orange: #fb923c;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --missed: #7f1d1d;
    --taken: #064e3b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
    letter-spacing: -0.02em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.875rem;
    margin-bottom: 2rem;
  }

  /* Main status card */
  .status-card {
    background: var(--card);
    border-radius: 1.25rem;
    padding: 2.5rem 2rem;
    text-align: center;
    width: 100%;
    max-width: 400px;
    margin-bottom: 1.5rem;
    position: relative;
    overflow: hidden;
  }

  .status-card.taken {
    border: 2px solid var(--green);
  }

  .status-card.pending {
    border: 2px solid var(--orange);
  }

  .status-icon {
    font-size: 4rem;
    margin-bottom: 1rem;
    display: block;
  }

  .status-text {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }

  .status-detail {
    color: var(--muted);
    font-size: 0.875rem;
    margin-bottom: 1.5rem;
  }

  .pill-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: #0f172a;
    border: none;
    border-radius: 1rem;
    padding: 1rem 2.5rem;
    font-size: 1.125rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.01em;
  }

  .pill-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(34, 211, 238, 0.3);
  }

  .pill-btn:active {
    transform: scale(0.98);
  }

  .pill-btn.done {
    background: var(--green);
    cursor: default;
    pointer-events: none;
  }

  .undo-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.8rem;
    cursor: pointer;
    margin-top: 1rem;
    text-decoration: underline;
    display: inline-block;
  }

  .undo-btn:hover { color: var(--text); }

  /* Streak section */
  .streak-section {
    width: 100%;
    max-width: 400px;
    margin-bottom: 1.5rem;
  }

  .streak-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.75rem;
  }

  .streak-title {
    font-size: 1rem;
    font-weight: 600;
  }

  .streak-count {
    color: var(--accent);
    font-size: 0.875rem;
    font-weight: 600;
  }

  .streak-bar {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .streak-day {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    background: var(--card);
    position: relative;
  }

  .streak-day.taken { background: var(--green); }
  .streak-day.missed { background: var(--red); opacity: 0.7; }
  .streak-day.today { outline: 2px solid var(--accent); outline-offset: 1px; }
  .streak-day.future { background: transparent; border: 1px solid #334155; }

  .streak-day .tooltip {
    display: none;
    position: absolute;
    bottom: 130%;
    left: 50%;
    transform: translateX(-50%);
    background: #334155;
    color: var(--text);
    padding: 0.25rem 0.5rem;
    border-radius: 0.375rem;
    font-size: 0.7rem;
    white-space: nowrap;
    z-index: 10;
  }

  .streak-day:hover .tooltip { display: block; }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    width: 100%;
    max-width: 400px;
    margin-bottom: 1.5rem;
  }

  .stat-card {
    background: var(--card);
    border-radius: 0.75rem;
    padding: 1rem;
    text-align: center;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
  }

  .stat-value.green { color: var(--green); }
  .stat-value.orange { color: var(--orange); }
  .stat-value.cyan { color: var(--accent); }

  .stat-label {
    color: var(--muted);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 0.25rem;
  }

  /* Settings */
  .settings-section {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border-radius: 1rem;
    padding: 1.25rem;
  }

  .settings-title {
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 1rem;
  }

  .setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
  }

  .setting-row:last-child { margin-bottom: 0; }

  .setting-label {
    color: var(--muted);
    font-size: 0.8rem;
  }

  .setting-input {
    background: var(--bg);
    border: 1px solid #334155;
    border-radius: 0.5rem;
    color: var(--text);
    padding: 0.375rem 0.5rem;
    font-size: 0.8rem;
    width: 80px;
    text-align: center;
  }

  .notif-btn {
    background: var(--accent-dim);
    color: var(--text);
    border: none;
    border-radius: 0.5rem;
    padding: 0.375rem 0.75rem;
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: 500;
  }

  .notif-btn:hover { background: var(--accent); color: #0f172a; }
  .notif-btn.enabled { background: var(--green); color: #0f172a; }

  .notif-status {
    color: var(--muted);
    font-size: 0.7rem;
    text-align: center;
    margin-top: 0.75rem;
  }

  .install-banner {
    width: 100%;
    max-width: 400px;
    background: linear-gradient(135deg, var(--accent-dim), #1e3a5f);
    border-radius: 1rem;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }

  .install-banner.visible { display: flex; }

  .install-text {
    font-size: 0.8rem;
    line-height: 1.4;
  }

  .install-text strong { display: block; margin-bottom: 0.15rem; }

  .install-btn {
    background: var(--accent);
    color: #0f172a;
    border: none;
    border-radius: 0.5rem;
    padding: 0.5rem 1rem;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .install-dismiss {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.2rem;
    padding: 0;
    line-height: 1;
  }

  @media (max-width: 440px) {
    body { padding: 1rem 0.75rem; }
    .status-card { padding: 2rem 1.5rem; }
    .streak-day { width: 14px; height: 14px; }
  }
</style>
</head>
<body>

<h1>Daily Pill Reminder</h1>
<p class="subtitle" id="dateDisplay"></p>

<div class="install-banner" id="installBanner">
  <div class="install-text"><strong>Install on your phone</strong>Add to home screen for notifications &amp; quick access</div>
  <button class="install-btn" id="installBtn" onclick="installApp()">Install</button>
  <button class="install-dismiss" onclick="dismissInstall()">×</button>
</div>

<div class="status-card" id="statusCard">
  <span class="status-icon" id="statusIcon"></span>
  <div class="status-text" id="statusText"></div>
  <div class="status-detail" id="statusDetail"></div>
  <button class="pill-btn" id="pillBtn" onclick="takePill()"></button>
  <br>
  <button class="undo-btn" id="undoBtn" onclick="undoPill()" style="display:none;">Undo — I didn't actually take it</button>
</div>

<div class="streak-section">
  <div class="streak-header">
    <span class="streak-title">Last 60 days</span>
    <span class="streak-count" id="streakCount"></span>
  </div>
  <div class="streak-bar" id="streakBar"></div>
</div>

<div class="stats-row">
  <div class="stat-card">
    <div class="stat-value green" id="statStreak">0</div>
    <div class="stat-label">Current Streak</div>
  </div>
  <div class="stat-card">
    <div class="stat-value cyan" id="statBest">0</div>
    <div class="stat-label">Best Streak</div>
  </div>
  <div class="stat-card">
    <div class="stat-value orange" id="statRate">0%</div>
    <div class="stat-label">30-Day Rate</div>
  </div>
</div>

<div class="settings-section">
  <div class="settings-title">Reminder Settings</div>
  <div class="setting-row">
    <span class="setting-label">Remind me at</span>
    <input type="time" class="setting-input" id="reminderTime" value="08:30" onchange="saveSettings()">
  </div>
  <div class="setting-row">
    <span class="setting-label">Nag every (min)</span>
    <input type="number" class="setting-input" id="nagInterval" value="15" min="5" max="60" onchange="saveSettings()">
  </div>
  <div class="setting-row">
    <span class="setting-label">Notifications</span>
    <button class="notif-btn" id="notifBtn" onclick="toggleNotifications()">Enable</button>
  </div>
  <div class="notif-status" id="notifStatus"></div>
</div>

<script>
// --- EARLY: Handle ?taken=true from service worker notification action ---
// This runs FIRST before anything else so localStorage write happens immediately
(function() {
  if (new URLSearchParams(window.location.search).get('taken') === 'true') {
    try {
      const EARLY_KEY = 'pillReminder';
      const raw = localStorage.getItem(EARLY_KEY);
      const data = raw ? JSON.parse(raw) : { days: {}, settings: { reminderTime: '08:30', nagInterval: 15, notificationsEnabled: false } };
      const d = new Date();
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if (!data.days[key]?.taken) {
        data.days[key] = { taken: true, time: d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) };
        localStorage.setItem(EARLY_KEY, JSON.stringify(data));
      }
      // Also set cache flag so service worker stops showing notifications
      try {
        caches.open('pill-taken-flags').then(function(cache) {
          cache.put('/pill-taken-' + key, new Response('true'));
        });
      } catch(e2) {}
    } catch(e) {}
    window.history.replaceState({}, '', window.location.pathname);
  }
})();

// --- Data Layer ---
const STORAGE_KEY = 'pillReminder';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { days: {}, settings: { reminderTime: '08:30', nagInterval: 15, notificationsEnabled: false } };
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function dateKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

function formatDate(d) {
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}

// --- Cache API flag (tells service worker to stop notifications) ---
function setCacheTakenFlag() {
  try {
    caches.open('pill-taken-flags').then((cache) => {
      cache.put('/pill-taken-' + todayKey(), new Response('true'));
    });
  } catch(e) {}
}

function clearCacheTakenFlag() {
  try {
    caches.open('pill-taken-flags').then((cache) => {
      cache.delete('/pill-taken-' + todayKey());
    });
  } catch(e) {}
}

// --- Core Actions ---
function takePill() {
  const data = loadData();
  const key = todayKey();
  data.days[key] = { taken: true, time: new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) };
  saveData(data);
  setCacheTakenFlag();
  render();
}

function undoPill() {
  const data = loadData();
  delete data.days[todayKey()];
  clearCacheTakenFlag();
  saveData(data);
  render();
}

function saveSettings() {
  const data = loadData();
  data.settings.reminderTime = document.getElementById('reminderTime').value;
  data.settings.nagInterval = parseInt(document.getElementById('nagInterval').value) || 15;
  saveData(data);
  scheduleNotifications();
}

// --- VAPID Public Key for Web Push ---
const VAPID_PUBLIC_KEY = 'BG4BXBHU4zebHlZFxjg5ekCQ7WDjrruDzhgJf0Mf89KaL1APOGr0gzGMoDT1GnnYDO4g3SV6ZVkW1-mPpW_NfTc';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

// --- Notifications ---
async function toggleNotifications() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) {
    document.getElementById('notifStatus').textContent = 'Notifications not supported in this browser';
    return;
  }

  const data = loadData();

  if (Notification.permission === 'granted') {
    if (data.settings.notificationsEnabled) {
      // Turning off
      data.settings.notificationsEnabled = false;
      saveData(data);
      render();
      scheduleNotifications();
      return;
    }
  }

  if (Notification.permission !== 'granted') {
    const result = await Notification.requestPermission();
    if (result !== 'granted') {
      document.getElementById('notifStatus').textContent = 'Permission denied. Enable in browser settings.';
      return;
    }
  }

  // Subscribe to Web Push for background notifications
  try {
    const reg = await navigator.serviceWorker.ready;
    let subscription = await reg.pushManager.getSubscription();
    if (!subscription) {
      subscription = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }

    data.settings.notificationsEnabled = true;
    data.settings.pushSubscription = JSON.stringify(subscription.toJSON());
    saveData(data);
    render();
    scheduleNotifications();

    // Show the subscription so user can copy it for GitHub Actions
    showSubscriptionSetup(subscription);
  } catch(e) {
    console.error('Push subscription failed:', e);
    // Show error visibly so we can debug
    const errDiv = document.createElement('div');
    errDiv.style.cssText = 'width:100%;max-width:400px;background:#7f1d1d;border-radius:1rem;padding:1.25rem;margin-top:1rem;font-size:0.8rem;color:#fca5a5;word-break:break-all;';
    errDiv.innerHTML = '<strong style="color:#f87171;font-size:0.9rem;">Push setup error</strong><br><br>' + e.message;
    document.querySelector('.settings-section').after(errDiv);
    // Fallback: just enable basic notifications
    data.settings.notificationsEnabled = true;
    saveData(data);
    render();
    scheduleNotifications();
  }
}

function showSubscriptionSetup(subscription) {
  const subJson = JSON.stringify(subscription.toJSON());
  const existing = document.getElementById('pushSetup');
  if (existing) existing.remove();

  const div = document.createElement('div');
  div.id = 'pushSetup';
  div.style.cssText = 'width:100%;max-width:400px;background:#1e293b;border-radius:1rem;padding:1.25rem;margin-top:1rem;';
  div.innerHTML = `
    <div style="font-size:0.875rem;font-weight:600;margin-bottom:0.75rem;color:#22d3ee;">Background Notifications Setup</div>
    <p style="font-size:0.75rem;color:#94a3b8;margin-bottom:0.75rem;line-height:1.5;">
      Copy the text below. You'll paste it as a secret in your GitHub repo so notifications work even when the app is closed.
    </p>
    <textarea id="subData" readonly style="width:100%;height:80px;background:#0f172a;color:#f1f5f9;border:1px solid #334155;border-radius:0.5rem;padding:0.5rem;font-size:0.65rem;font-family:monospace;resize:none;">${subJson}</textarea>
    <button onclick="navigator.clipboard.writeText(document.getElementById('subData').value);this.textContent='Copied!';setTimeout(()=>this.textContent='Copy to clipboard',2000)" style="margin-top:0.5rem;width:100%;background:#22d3ee;color:#0f172a;border:none;border-radius:0.5rem;padding:0.5rem;font-weight:600;font-size:0.8rem;cursor:pointer;">Copy to clipboard</button>
  `;
  document.querySelector('.settings-section').after(div);
}

let notifTimer = null;

function scheduleNotifications() {
  if (notifTimer) clearInterval(notifTimer);

  const data = loadData();
  if (!data.settings.notificationsEnabled) return;

  const nagMs = (data.settings.nagInterval || 15) * 60 * 1000;

  notifTimer = setInterval(() => {
    const now = new Date();
    const data = loadData();
    const key = todayKey();

    // Already taken today — no notification
    if (data.days[key]?.taken) return;

    // Parse reminder time
    const [h, m] = (data.settings.reminderTime || '08:30').split(':').map(Number);
    const reminderTime = new Date();
    reminderTime.setHours(h, m, 0, 0);

    // Only notify after reminder time and before 2pm
    if (now < reminderTime) return;
    const cutoff = new Date();
    cutoff.setHours(14, 0, 0, 0);
    if (now > cutoff) return;

    // Send notification via service worker (supports action buttons)
    showPillNotification("You haven't confirmed your pill today. Don't forget!");
  }, nagMs);

  // Also check immediately
  setTimeout(() => {
    const data = loadData();
    const key = todayKey();
    if (data.days[key]?.taken) return;
    const now = new Date();
    const [h, m] = (data.settings.reminderTime || '08:30').split(':').map(Number);
    const reminderTime = new Date();
    reminderTime.setHours(h, m, 0, 0);
    if (now >= reminderTime) {
      showPillNotification("Good morning! Time to take your pill.");
    }
  }, 1000);
}

async function showPillNotification(body) {
  try {
    const reg = await navigator.serviceWorker.ready;
    reg.showNotification('💊 Take your pill!', {
      body: body,
      icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="80">💊</text></svg>',
      badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="80">💊</text></svg>',
      requireInteraction: true,
      tag: 'pill-reminder',
      renotify: true,
      actions: [
        { action: 'took-pill', title: '✅ Took it!' },
        { action: 'snooze', title: '⏰ Snooze 10min' }
      ]
    });
  } catch(e) {
    // Fallback to basic notification if SW not available
    try {
      new Notification('Take your pill!', { body: body, tag: 'pill-reminder' });
    } catch(e2) {}
  }
}

// --- Stats ---
function calcStats(data) {
  const today = new Date();
  let currentStreak = 0;
  let bestStreak = 0;
  let tempStreak = 0;
  let taken30 = 0;

  // Calculate from 365 days ago
  for (let i = 0; i < 365; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = dateKey(d);

    if (i < 30 && data.days[key]?.taken) taken30++;

    if (data.days[key]?.taken) {
      if (i === 0 || tempStreak > 0) tempStreak++;
      if (tempStreak > bestStreak) bestStreak = tempStreak;
    } else {
      if (i === 0) {
        // Today not taken yet — streak might still be alive
        tempStreak = 0;
      } else {
        if (currentStreak === 0 && tempStreak > 0) currentStreak = tempStreak;
        tempStreak = 0;
      }
    }
  }

  // If today is taken
  if (data.days[todayKey()]?.taken && currentStreak === 0) currentStreak = tempStreak;
  // If today isn't taken, current streak is from yesterday
  if (!data.days[todayKey()]?.taken) {
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    if (data.days[dateKey(yesterday)]?.taken) {
      // Count back from yesterday
      let s = 0;
      for (let i = 1; i < 365; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        if (data.days[dateKey(d)]?.taken) s++;
        else break;
      }
      currentStreak = s;
    }
  }

  const rate30 = Math.round((taken30 / 30) * 100);
  return { currentStreak, bestStreak, rate30 };
}

// --- Render ---
function render() {
  const data = loadData();
  const key = todayKey();
  const takenToday = data.days[key]?.taken;
  const takenTime = data.days[key]?.time;

  // Date display
  document.getElementById('dateDisplay').textContent = formatDate(new Date());

  // Status card
  const card = document.getElementById('statusCard');
  const icon = document.getElementById('statusIcon');
  const text = document.getElementById('statusText');
  const detail = document.getElementById('statusDetail');
  const btn = document.getElementById('pillBtn');
  const undo = document.getElementById('undoBtn');

  if (takenToday) {
    card.className = 'status-card taken';
    icon.textContent = '✅';
    text.textContent = "You're all set today!";
    detail.textContent = `Taken at ${takenTime}`;
    btn.textContent = 'Done!';
    btn.className = 'pill-btn done';
    undo.style.display = 'inline-block';
  } else {
    card.className = 'status-card pending';
    icon.textContent = '💊';
    text.textContent = 'Time to take your pill';
    const now = new Date();
    const [h, m] = (data.settings.reminderTime || '08:30').split(':').map(Number);
    const reminder = new Date(); reminder.setHours(h, m, 0, 0);
    if (now > reminder) {
      const diffMin = Math.round((now - reminder) / 60000);
      if (diffMin > 60) {
        detail.textContent = `⚠️ ${Math.round(diffMin/60)}h ${diffMin%60}m past your reminder time`;
      } else if (diffMin > 0) {
        detail.textContent = `⚠️ ${diffMin} min past your reminder time`;
      } else {
        detail.textContent = 'Right on time!';
      }
    } else {
      detail.textContent = `Reminder set for ${data.settings.reminderTime}`;
    }
    btn.textContent = 'I took my pill ✓';
    btn.className = 'pill-btn';
    undo.style.display = 'none';
  }

  // Streak bar (60 days)
  const bar = document.getElementById('streakBar');
  bar.innerHTML = '';
  const today = new Date();
  for (let i = 59; i >= -6; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const dk = dateKey(d);
    const div = document.createElement('div');
    div.className = 'streak-day';

    if (i < 0) {
      div.classList.add('future');
    } else if (i === 0) {
      div.classList.add('today');
      if (data.days[dk]?.taken) div.classList.add('taken');
    } else {
      if (data.days[dk]?.taken) div.classList.add('taken');
      else div.classList.add('missed');
    }

    const label = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const status = data.days[dk]?.taken ? '✓' : (i <= 0 ? '' : '✗');
    div.innerHTML = `<span class="tooltip">${label} ${status}</span>`;
    bar.appendChild(div);
  }

  // Stats
  const stats = calcStats(data);
  document.getElementById('statStreak').textContent = stats.currentStreak;
  document.getElementById('statBest').textContent = stats.bestStreak;
  document.getElementById('statRate').textContent = stats.rate30 + '%';
  document.getElementById('streakCount').textContent = stats.currentStreak > 0
    ? `🔥 ${stats.currentStreak} day streak`
    : 'Start your streak!';

  // Settings
  document.getElementById('reminderTime').value = data.settings.reminderTime || '08:30';
  document.getElementById('nagInterval').value = data.settings.nagInterval || 15;

  const notifBtn = document.getElementById('notifBtn');
  const notifStatus = document.getElementById('notifStatus');

  if (data.settings.notificationsEnabled && Notification.permission === 'granted') {
    notifBtn.textContent = 'On';
    notifBtn.className = 'notif-btn enabled';
    notifStatus.textContent = takenToday
      ? 'Notifications paused — pill taken today'
      : `Will remind every ${data.settings.nagInterval} min starting at ${data.settings.reminderTime}`;
  } else {
    notifBtn.textContent = 'Enable';
    notifBtn.className = 'notif-btn';
    notifStatus.textContent = 'Enable to get nudged until you take your pill';
  }
}

// --- PWA Install ---
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('visible');
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
    document.getElementById('installBanner').classList.remove('visible');
  }
}

function dismissInstall() {
  document.getElementById('installBanner').classList.remove('visible');
}

// Register service worker (don't unregister — that kills push subscriptions!)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
    .then((reg) => { reg.update(); })
    .catch(() => {});
}

// --- Init ---
render();
scheduleNotifications();

// Re-render every minute
setInterval(render, 60000);

// Re-render on focus
window.addEventListener('focus', () => { render(); });
</script>
